<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071421" />
    <title>Dragon Isle of Legends</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game" aria-live="polite">
      <img id="scene-image" alt="" draggable="false" />
      <div class="scene-shade" aria-hidden="true"></div>

      <header class="scene-header">
        <p id="scene-region">Azurelake</p>
        <h1 id="scene-title"></h1>
      </header>

      <div id="scene-controls" aria-label="Scene navigation"></div>

      <p id="route-message" role="status" aria-live="polite"></p>

      <footer class="scene-footer">
        <button id="history-back" type="button" aria-label="Return to previous scene">
          Back
        </button>
        <p id="scene-hint"></p>
      </footer>
    </main>

    <noscript>This scene navigator requires JavaScript.</noscript>
    <script type="module" src="./game.js"></script>
  </body>
</html>
